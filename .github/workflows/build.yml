name: Build Red Theme Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract ZIP
        run: unzip -q red-theme-plugin.zip

      - name: Clone MargyT
        run: git clone --branch main https://github.com/narezany/MargyT.git

      - name: Install MargyT dependencies
        run: |
          cd MargyT
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml requests
          echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # ВАЖНО: Собираем API MargyT, чтобы получить классы cat.narezany.margyt.*
      - name: Build MargyT API
        run: |
          cd MargyT
          # Собираем API (если есть build.sh или аналогичный скрипт)
          if [ -f build.sh ]; then bash build.sh; fi
          # Ищем собранные классы API
          find . -name "*.jar" -o -name "*.class" | head -20

      # Теперь собираем плагин, указывая путь к API
      - name: Build Plugin
        run: |
          cd MargyT
          cp -r ../red-theme-plugin .
          # Ищем собранные классы API и добавляем в CLASSPATH
          API_PATH=$(find . -type d -name "classes" -o -type d -name "out" -o -type d -name "build" | head -1)
          export CLASSPATH="$API_PATH:$PWD/inject/java:$PWD:$CLASSPATH"
          echo "CLASSPATH=$CLASSPATH"
          python3 -m margyt.plugin red-theme-plugin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: MargyT/margyt.redtheme.mtp
