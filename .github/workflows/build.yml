name: Build Red Theme Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Extract ZIP
        run: unzip -q red-theme-plugin.zip
      
      - name: Clone MargyT
        run: git clone --branch main https://github.com/narezany/MargyT.git
      
      - name: Install MargyT dependencies
        run: |
          cd MargyT
          # Если есть requirements.txt, устанавливаем из него
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Устанавливаем базовые зависимости, если их нет
          pip install pyyaml requests
          # Добавляем текущую папку в PYTHONPATH, чтобы модули были видны
          echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      
      - name: Build Plugin
        run: |
          cd MargyT
          cp -r ../red-theme-plugin .
          python3 -m margyt.plugin red-theme-plugin
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: MargyT/margyt.redtheme.mtp
